# Sentinel default configuration
# Override via CLI flags or environment variables

[scan]
threads = 50
rps = 10
timeout = 10
browser = false
port_scan = true

[output]
file = "sentinel_report.json"
format = "json"

[http]
user_agent = "Mozilla/5.0 (compatible; Sentinel/0.2.0)"
follow_redirects = true
max_redirects = 5

[scope]
# Domain is auto-set from --target
# Add additional allowed domains here
extra = []

[scripts]
dir = "scripts"

# LLM-assisted vulnerability analysis (Phase 7)
# Opt-in: enable via --llm flag or set enabled = true here
[llm]
enabled = true
provider = "openai-compat"
# Gemma 4 via Ollama - see /home/typemnm/gemma4/ for setup
# OpenAI: "https://api.openai.com/v1"
# Ollama: "http://localhost:11434/v1"
# vLLM:   "http://localhost:8000/v1"
api_base = "http://localhost:11434/v1"
model = "gemma3:27b"
# API key: set here or via SENTINEL_LLM_API_KEY env var
# Leave empty for local servers (Ollama, llama.cpp) that need no auth
api_key = ""
api_timeout_secs = 180
max_tokens = 2048
temperature = 0.2
# Only analyze findings at or above this severity: info, low, medium, high, critical
min_severity = "high"
# Maximum findings to send to LLM per scan (cost control)
max_findings = 20
# Maximum attack payloads generated per finding
max_attacks_per_finding = 5
# Dry-run: generate payloads but don't execute them (safe preview mode)
dry_run = false
# Max chars of evidence included in prompts (prompt injection mitigation)
max_evidence_chars = 4096
